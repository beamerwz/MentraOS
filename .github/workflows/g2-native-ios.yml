name: G2 Native Labs unsigned IPA

on:
  push:
    branches: [g2-native-labs]
    paths:
      - "g2-native/**"
      - ".github/workflows/g2-native-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate standalone Xcode project
        working-directory: g2-native
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: g2-native
        run: |
          set -euo pipefail
          xcodebuild \
            -project G2NativeLabs.xcodeproj \
            -scheme G2NativeLabs \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee ../g2-native-xcodebuild.log

      - name: Package IPA
        working-directory: g2-native
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry G2_LABS_NATIVE_unsigned.ipa Payload
          rm -rf Payload
          ls -lh G2_LABS_NATIVE_unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: G2_LABS_NATIVE_unsigned_IPA
          path: g2-native/G2_LABS_NATIVE_unsigned.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: G2_NATIVE_xcodebuild_log
          path: g2-native-xcodebuild.log
          if-no-files-found: ignore
