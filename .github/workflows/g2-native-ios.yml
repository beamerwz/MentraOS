name: G2 Native Labs unsigned IPA

on:
  push:
    branches: [g2-native-labs]
    paths:
      - "g2-native/**"
      - "mobile/modules/bluetooth-sdk/ios/**"
      - ".github/workflows/g2-native-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup Nemotron-compatible Sherpa + ONNX Runtime
        run: |
          set -euo pipefail
          SHERPA_VERSION="1.13.8"
          ORT_VERSION="1.28.2"
          PKG="mobile/modules/bluetooth-sdk/ios/Packages/SherpaOnnx"
          SHERPA_DEST="$PKG/sherpa-onnx.xcframework"
          ORT_DEST="$PKG/onnxruntime.xcframework"
          HEADER_DEST="$PKG/CurrentHeaders"

          rm -rf "$SHERPA_DEST" "$ORT_DEST" "$HEADER_DEST"
          mkdir -p /tmp/g2-sherpa /tmp/g2-ort "$HEADER_DEST"

          curl -fL --retry 3             "https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v$SHERPA_VERSION-ios-static.xcframework.zip"             -o /tmp/g2-sherpa/sherpa.zip
          unzip -q /tmp/g2-sherpa/sherpa.zip -d /tmp/g2-sherpa/unpacked
          SHERPA_FOUND="$(find /tmp/g2-sherpa/unpacked -type d -name '*.xcframework' | head -1)"
          test -n "$SHERPA_FOUND"
          mv "$SHERPA_FOUND" "$SHERPA_DEST"

          curl -fL --retry 3             "https://github.com/csukuangfj/onnxruntime-libs/releases/download/v$ORT_VERSION/onnxruntime-ios-static-xcframework-$ORT_VERSION.xcframework.zip"             -o /tmp/g2-ort/ort.zip
          unzip -q /tmp/g2-ort/ort.zip -d /tmp/g2-ort/unpacked
          ORT_FOUND="$(find /tmp/g2-ort/unpacked -type d -name '*.xcframework' | head -1)"
          test -n "$ORT_FOUND"
          mv "$ORT_FOUND" "$ORT_DEST"

          CAPI_HEADER="$(find "$SHERPA_DEST" -type f -path '*/sherpa-onnx/c-api/c-api.h' | head -1)"
          test -n "$CAPI_HEADER"
          CAPI_ROOT="${CAPI_HEADER%/sherpa-onnx/c-api/c-api.h}"
          cp -R "$CAPI_ROOT/" "$HEADER_DEST/"

          echo "Sherpa framework:"
          find "$SHERPA_DEST" -maxdepth 4 -type f | head -30
          echo "ORT framework:"
          find "$ORT_DEST" -maxdepth 4 -type f | head -20
          test -f "$HEADER_DEST/sherpa-onnx/c-api/c-api.h"

      - name: Generate standalone Xcode project
        working-directory: g2-native
        run: xcodegen generate

      - name: Install Mentra Bluetooth SDK pods
        working-directory: g2-native
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod install --repo-update

      - name: Build unsigned device app
        working-directory: g2-native
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace G2NativeLabs.xcworkspace \
            -scheme G2NativeLabs \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee ../g2-native-xcodebuild.log

      - name: Package IPA
        working-directory: g2-native
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry G2_LABS_NATIVE_unsigned.ipa Payload
          rm -rf Payload
          ls -lh G2_LABS_NATIVE_unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: G2_LABS_NATIVE_unsigned_IPA
          path: g2-native/G2_LABS_NATIVE_unsigned.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: G2_NATIVE_xcodebuild_log
          path: g2-native-xcodebuild.log
          if-no-files-found: ignore
