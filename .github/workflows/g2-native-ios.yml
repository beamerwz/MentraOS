name: G2 Native Labs unsigned IPA

on:
  push:
    branches: [g2-native-labs]
    paths:
      - "g2-native/**"
      - ".github/workflows/g2-native-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup ABI-matched ONNX Runtime
        run: |
          set -euo pipefail
          ORT_VERSION="1.26.0"
          PKG="mobile/modules/bluetooth-sdk/ios/Packages/SherpaOnnx"
          DEST="$PKG/onnxruntime.xcframework"
          if [ ! -d "$DEST" ]; then
            mkdir -p /tmp/g2-ort
            curl -fL --retry 3 \
              "https://github.com/csukuangfj/onnxruntime-libs/releases/download/v$ORT_VERSION/onnxruntime-ios-static-xcframework-$ORT_VERSION.zip" \
              -o /tmp/g2-ort/ort.zip
            unzip -q /tmp/g2-ort/ort.zip -d /tmp/g2-ort/unpacked
            FOUND="$(find /tmp/g2-ort/unpacked -type d -name onnxruntime.xcframework | head -1)"
            test -n "$FOUND"
            mv "$FOUND" "$DEST"
          fi
          test -f "$DEST/ios-arm64/onnxruntime.framework/onnxruntime"

      - name: Generate standalone Xcode project
        working-directory: g2-native
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: g2-native
        run: |
          set -euo pipefail
          xcodebuild \
            -project G2NativeLabs.xcodeproj \
            -scheme G2NativeLabs \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee ../g2-native-xcodebuild.log

      - name: Package IPA
        working-directory: g2-native
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry G2_LABS_NATIVE_unsigned.ipa Payload
          rm -rf Payload
          ls -lh G2_LABS_NATIVE_unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: G2_LABS_NATIVE_unsigned_IPA
          path: g2-native/G2_LABS_NATIVE_unsigned.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: G2_NATIVE_xcodebuild_log
          path: g2-native-xcodebuild.log
          if-no-files-found: ignore
