name: G2 Glasses unsigned iOS IPA

on:
  push:
    branches:
      - g2-italian-offline-3.1.1
      - g2-labs-latency-trace
      - g2-labs-phase1
      - g2-labs-next-background-captions
      - g2-labs-latency-lab
      - g2-labs-ui-3.1.2-dark-purple
      - g2-labs-3.1.3-search-v2
      - g2-labs-3.1.4-integrated-ui-library
      - g2-labs-3.1.5-polish-models-captions
      - g2-labs-3.1.6-latency-runtime-pack
    paths:
      - "mobile/**"
      - ".github/workflows/g2-access-ios-unsigned.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-access-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      G2_ACCESS_BUILD: "1"
      EXPO_PUBLIC_BUILD_ENV: dev
      EXPO_PUBLIC_G2_LABS: "1"
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: g2-access-no-navigation
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_ALLOW_FAILURE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Read G2 LABS version
        id: g2_version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Free space not needed by iOS build
        run: |
          rm -rf "$HOME/Library/Android/sdk" 2>/dev/null || true
          rm -rf "$HOME/.gradle" 2>/dev/null || true
          rm -rf "$HOME/.android" 2>/dev/null || true
          df -h /

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build G2 LABS offline Captions bundle
        env:
          HUSKY: "0"
          MENTRA_PUBLIC_G2_LABS: "1"
        run: |
          set -euo pipefail
          # Build the miniapp in an isolated worktree. Root workspace install
          # must never mutate the dependency graph used by the iOS app build;
          # doing so caused React Native Skia's Apple prebuilts to disappear.
          TMP_WORKTREE="$RUNNER_TEMP/g2labs-captions-worktree"
          rm -rf "$TMP_WORKTREE"
          git worktree add --detach "$TMP_WORKTREE" HEAD
          cleanup() {
            git worktree remove --force "$TMP_WORKTREE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          (
            cd "$TMP_WORKTREE"
            bun install --no-frozen-lockfile
            bun run build:miniapp
            cd miniapps/captions
            bun run pack
          )

          CAPTIONS_ZIP="$TMP_WORKTREE/miniapps/captions/build/com.mentra.captions-1.0.17.zip"
          test -f "$CAPTIONS_ZIP" || { echo "::error::Captions 1.0.17 bundle was not produced"; exit 1; }
          rm -f mobile/assets/miniapps/com.mentra.captions-*.zip
          cp "$CAPTIONS_ZIP" mobile/assets/miniapps/com.mentra.captions-1.0.17.zip
          bun mobile/scripts/generate-bundled-miniapps.mjs
          ls -lh mobile/assets/miniapps/com.mentra.captions-1.0.17.zip

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: |
          set -euo pipefail
          # This is now a clean mobile install, matching the last-known-good
          # successful iOS build path.
          bun install --no-frozen-lockfile

      - name: Restore React Native Skia prebuilt binaries
        working-directory: mobile
        run: |
          set -euo pipefail
          SKIA_INSTALL="node_modules/@shopify/react-native-skia/scripts/install-skia.mjs"
          test -f "$SKIA_INSTALL" || { echo "::error::Skia install script not found"; exit 1; }
          for attempt in 1 2 3; do
            if node "$SKIA_INSTALL"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Skia binary download failed after 3 attempts"
              exit 1
            fi
            echo "Skia download attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          find node_modules/@shopify/react-native-skia -maxdepth 4 \( -name '*.xcframework' -o -name 'libs' \) -print | head -30

      - name: Configure development environment
        working-directory: mobile
        run: |
          cp .env.example .env
          {
            echo "G2_ACCESS_BUILD=1"
            echo "EXPO_PUBLIC_BUILD_ENV=dev"
            echo "EXPO_PUBLIC_G2_LABS=1"
            echo "EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=g2-access-no-navigation"
          } >> .env

      - name: Disable phone navigation for token-free accessibility build
        working-directory: mobile
        run: |
          cp scripts/g2-access/NavigationManager.swift modules/crust/ios/navigation/NavigationManager.swift
          cp scripts/g2-access/NavPayloads.swift modules/crust/ios/navigation/NavPayloads.swift

      - name: Generate iOS project
        working-directory: mobile
        run: bun expo prebuild --platform ios

      - name: Setup Sherpa and ABI-matched ONNX Runtime
        working-directory: mobile
        run: |
          rm -rf modules/bluetooth-sdk/ios/Packages/SherpaOnnx/sherpa-onnx.xcframework
          rm -rf modules/bluetooth-sdk/ios/Packages/SherpaOnnx/onnxruntime.xcframework
          chmod +x scripts/setup-sherpa-onnx-optional.sh
          ./scripts/setup-sherpa-onnx-optional.sh

      - name: Setup whisper.cpp native iOS runtime
        working-directory: mobile
        run: |
          set -euo pipefail
          DEST="modules/bluetooth-sdk/ios/Packages/WhisperCpp"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          curl -fL --retry 3 --retry-delay 3 "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.2/whisper-v1.9.2-xcframework.zip" -o "$RUNNER_TEMP/whisper-xcframework.zip"
          unzip -q "$RUNNER_TEMP/whisper-xcframework.zip" -d "$RUNNER_TEMP/whisper-xcframework"
          FOUND="$(find "$RUNNER_TEMP/whisper-xcframework" -type d -name 'whisper.xcframework' | head -1)"
          test -n "$FOUND"
          cp -R "$FOUND" "$DEST/whisper.xcframework"
          test -f "$DEST/whisper.xcframework/Info.plist"

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Verify single ONNX Runtime linkage
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          if grep -R "onnxruntime-objc" Podfile.lock Pods/Manifest.lock 2>/dev/null; then
            echo "::error::Duplicate CocoaPods ONNX Runtime is still linked alongside Sherpa"
            exit 1
          fi
          ORT_BIN="../modules/bluetooth-sdk/ios/Packages/SherpaOnnx/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/onnxruntime"
          test -f "$ORT_BIN" || { echo "::error::Matching ORT 1.26.0 binary missing"; exit 1; }
          nm -gU "$ORT_BIN" > /tmp/ort-symbols.txt
          grep -q '_OrtGetApiBase$' /tmp/ort-symbols.txt || { echo "::error::_OrtGetApiBase missing from ORT 1.26.0"; exit 1; }
          grep -q '_OrtSessionOptionsAppendExecutionProvider_CoreML$' /tmp/ort-symbols.txt || { echo "::error::CoreML provider symbol missing from ORT 1.26.0"; exit 1; }
          echo "OK: ABI-matched ONNX Runtime 1.26.0 symbols verified"

      - name: Build unsigned device app
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' -type d | head -1)"
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No Xcode workspace generated"
            ls -la
            exit 1
          fi
          WORKSPACE_NAME="$(basename "$WORKSPACE")"
          SCHEME="${WORKSPACE_NAME%.xcworkspace}"
          AVAILABLE_SCHEMES="$(xcodebuild -workspace "$WORKSPACE_NAME" -list -json)"
          echo "$AVAILABLE_SCHEMES"
          if ! echo "$AVAILABLE_SCHEMES" | python3 -c 'import json,sys; d=json.load(sys.stdin); target=sys.argv[1]; sys.exit(0 if target in d["workspace"]["schemes"] else 1)' "$SCHEME"; then
            echo "::error::Expected app scheme $SCHEME was not generated"
            exit 1
          fi
          echo "Building workspace=$WORKSPACE_NAME scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-g2-access \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.beamerwz.g2labs" \
            INFOPLIST_KEY_CFBundleDisplayName="G2 Glasses" \
            build | tee ../../g2-access-xcodebuild.log

      - name: Package unsigned IPA
        working-directory: mobile
        run: |
          set -euo pipefail
          APP="$(find ios/build-g2-access/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::No device .app found"
            exit 1
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "Payload/$(basename "$APP")/Info.plist"
          VERSION="${{ steps.g2_version.outputs.version }}"
          IPA="G2_Glasses_v${VERSION}_unsigned.ipa"
          zip -qry "$IPA" Payload
          rm -rf Payload
          ls -lh "$IPA"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: G2_Glasses_v${{ steps.g2_version.outputs.version }}_unsigned_IPA
          path: mobile/G2_Glasses_v*_unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: G2_ACCESS_xcodebuild_log
          path: g2-access-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
