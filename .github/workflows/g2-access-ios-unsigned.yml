name: G2 Access unsigned iOS IPA

on:
  push:
    branches:
      - g2-italian-offline-3.1.1
      - g2-labs-latency-trace
      - g2-labs-phase1
    paths:
      - "mobile/**"
      - ".github/workflows/g2-access-ios-unsigned.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-access-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      G2_ACCESS_BUILD: "1"
      EXPO_PUBLIC_BUILD_ENV: dev
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: g2-access-no-navigation
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_ALLOW_FAILURE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Free space not needed by iOS build
        run: |
          rm -rf "$HOME/Library/Android/sdk" 2>/dev/null || true
          rm -rf "$HOME/.gradle" 2>/dev/null || true
          rm -rf "$HOME/.android" 2>/dev/null || true
          df -h /

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: bun install --no-frozen-lockfile

      - name: Configure development environment
        working-directory: mobile
        run: |
          cp .env.example .env
          {
            echo "G2_ACCESS_BUILD=1"
            echo "EXPO_PUBLIC_BUILD_ENV=dev"
            echo "EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=g2-access-no-navigation"
          } >> .env

      - name: Disable phone navigation for token-free accessibility build
        working-directory: mobile
        run: |
          cp scripts/g2-access/NavigationManager.swift modules/crust/ios/navigation/NavigationManager.swift
          cp scripts/g2-access/NavPayloads.swift modules/crust/ios/navigation/NavPayloads.swift

      - name: Generate iOS project
        working-directory: mobile
        run: bun expo prebuild --platform ios

      - name: Setup Sherpa and ABI-matched ONNX Runtime
        working-directory: mobile
        run: |
          rm -rf modules/bluetooth-sdk/ios/Packages/SherpaOnnx/sherpa-onnx.xcframework
          rm -rf modules/bluetooth-sdk/ios/Packages/SherpaOnnx/onnxruntime.xcframework
          chmod +x scripts/setup-sherpa-onnx-optional.sh
          ./scripts/setup-sherpa-onnx-optional.sh

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Verify single ONNX Runtime linkage
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          if grep -R "onnxruntime-objc" Podfile.lock Pods/Manifest.lock 2>/dev/null; then
            echo "::error::Duplicate CocoaPods ONNX Runtime is still linked alongside Sherpa"
            exit 1
          fi
          ORT_BIN="../modules/bluetooth-sdk/ios/Packages/SherpaOnnx/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/onnxruntime"
          test -f "$ORT_BIN" || { echo "::error::Matching ORT 1.27.1 binary missing"; exit 1; }
          nm -gU "$ORT_BIN" > /tmp/ort-symbols.txt
          grep -q '_OrtGetApiBase$' /tmp/ort-symbols.txt || { echo "::error::_OrtGetApiBase missing from ORT 1.27.1"; exit 1; }
          grep -q '_OrtSessionOptionsAppendExecutionProvider_CoreML$' /tmp/ort-symbols.txt || { echo "::error::CoreML provider symbol missing from ORT 1.27.1"; exit 1; }
          echo "OK: ABI-matched ONNX Runtime 1.27.1 symbols verified"

      - name: Build unsigned device app
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' -type d | head -1)"
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No Xcode workspace generated"
            ls -la
            exit 1
          fi
          WORKSPACE_NAME="$(basename "$WORKSPACE")"
          SCHEME="${WORKSPACE_NAME%.xcworkspace}"
          AVAILABLE_SCHEMES="$(xcodebuild -workspace "$WORKSPACE_NAME" -list -json)"
          echo "$AVAILABLE_SCHEMES"
          if ! echo "$AVAILABLE_SCHEMES" | python3 -c 'import json,sys; d=json.load(sys.stdin); target=sys.argv[1]; sys.exit(0 if target in d["workspace"]["schemes"] else 1)' "$SCHEME"; then
            echo "::error::Expected app scheme $SCHEME was not generated"
            exit 1
          fi
          echo "Building workspace=$WORKSPACE_NAME scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-g2-access \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.beamerwz.g2labs" \
            INFOPLIST_KEY_CFBundleDisplayName="G2 LABS" \
            build | tee ../../g2-access-xcodebuild.log

      - name: Package unsigned IPA
        working-directory: mobile
        run: |
          set -euo pipefail
          APP="$(find ios/build-g2-access/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::No device .app found"
            exit 1
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "Payload/$(basename "$APP")/Info.plist"
          zip -qry G2_LABS_Phase1_unsigned.ipa Payload
          rm -rf Payload
          ls -lh G2_LABS_Phase1_unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: G2_LABS_Phase1_unsigned_IPA
          path: mobile/G2_LABS_Phase1_unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: G2_ACCESS_xcodebuild_log
          path: g2-access-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
