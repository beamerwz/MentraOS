name: G2NativeLabs
options:
  bundleIdPrefix: com.beamerwz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  G2NativeLabs:
    type: application
    platform: iOS
    sources:
      - G2NativeLabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beamerwz.g2nativelabs
        PRODUCT_NAME: G2 LABS Native
        INFOPLIST_KEY_CFBundleDisplayName: G2 LABS Native
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: G2 LABS uses Bluetooth to connect directly to your G2 glasses.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: G2 LABS can use microphone audio for local speech recognition diagnostics.
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
