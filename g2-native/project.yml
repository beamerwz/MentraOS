name: G2NativeLabs
options:
  bundleIdPrefix: com.beamerwz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9

targets:
  G2NativeLabs:
    type: application
    platform: iOS
    sources:
      - path: G2NativeLabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beamerwz.g2nativelabs
        PRODUCT_NAME: G2 LABS Native
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: G2NativeLabs/G2NativeLabs-Bridging-Header.h
        GCC_ENABLE_CPP_EXCEPTIONS: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lbz2"
        INFOPLIST_KEY_CFBundleDisplayName: G2 LABS Native
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: G2 LABS uses Mentra Bluetooth SDK to pair with and communicate with your G2 glasses.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: G2 LABS processes G2 microphone audio locally for offline speech recognition.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes:
          - bluetooth-central
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
